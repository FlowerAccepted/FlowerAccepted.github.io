<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Page</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">

    <style>
        body {
            margin: 0;
            background: #f5f6fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: #fff;
            padding: 40px;
            width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            margin-bottom: 20px;
        }

        #content {
            text-align: left;
            margin-top: 20px;
            color: #333;
            line-height: 1.6;
        }

        a { color: #0070f3; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <img class="avatar" src="avatar.png" alt="avatar" />
        <div id="content"></div>
    </div>

    <!-- 内置轻量 Markdown 渲染（marked.js） -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // 在这里写你的 Markdown 文本（256 字以内）
        const markdownText = `
# 欢迎
本页面将移动到 Vercel，敬请期待更多彩的呈现
        `;

        document.getElementById("content").innerHTML = marked.parse(markdownText);
    </script>

</body>
</html>
